version: "3.8"

services:
  stun:
    image: stun:local
    # 允许从本项目目录重建镜像（Dockerfile 在根目录）。
    # 加上 build 后：主机 `docker compose build` 或 Portainer 以「Git 仓库」方式
    # 部署/Update 时，都会用当前源码重新构建 stun:local，无需手工维护镜像。
    build: .
    container_name: stun
    mac_address: 02:42:c0:a8:06:68
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=80
    volumes:
      - /mnt/sda1/stun:/data
    networks:
      macvlan_net:
        ipv4_address: 192.168.6.104
    restart: unless-stopped

networks:
  macvlan_net:
    external: true
    name: bridge-host
