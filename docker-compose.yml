version: "3.8"

services:
  stun:
    image: stun:local
    container_name: stun
    mac_address: 02:42:c0:a8:06:68
    environment:
      - TZ=Asia/Shanghai
      - WEB_PORT=80
    volumes:
      - /mnt/sda1/stun:/data
    networks:
      macvlan_net:
        ipv4_address: 192.168.6.104
    restart: unless-stopped

networks:
  macvlan_net:
    external: true
    name: bridge-host
