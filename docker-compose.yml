version: "3.8"

services:
  stun:
    image: stun:local
    container_name: stun
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - /mnt/sda1/stun:/data
    networks:
      macvlan_net:
        ipv4_address: 192.168.6.104
    mac_address: "02:42:C0:A8:06:68"
    restart: unless-stopped

networks:
  macvlan_net:
    external: true
    name: bridge-host
